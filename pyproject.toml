[project]
name = "pitchvision"
version = "0.1.0"
description = "A probabilistic player-reconstruction system that uses spatiotemporal deep learning to recover off-camera football players from partial tracking data, and runs in the browser."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
data = ["kloppy"]
ml = ["torch"]
export = ["onnx"]
dev = ["pytest", "ruff", "hypothesis", "mypy", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
