[project]
name = "pitchvision"
version = "0.1.0"
description = "See the players the TV camera misses. Reconstructs off-screen footballers from broadcast tracking data and forecasts their next moves, live in your browser."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
data = ["kloppy"]
ml = ["torch"]
dev = ["pytest", "ruff", "hypothesis", "mypy", "pandas-stubs"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.mypy]
ignore_missing_imports = true
